<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PYTHON·LAB — The In-Browser Python Learning Workbench. Write and run real Python in your browser.">
<title>PYTHON·LAB — Interactive Python Learning Workbench</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234d9fff'/><text x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' fill='%230b1524' text-anchor='middle'>Py</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css">
<link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
<a class="skip-link" href="#viewRoot">Skip to content</a>

<header class="topbar" role="banner">
  <button class="brand" id="brandHome" aria-label="PYTHON·LAB home">
    <span class="brand-mark" aria-hidden="true">Py</span>
    <span class="brand-text">PYTHON<i>·</i>LAB</span>
  </button>
  <nav class="mainnav" id="mainNav" role="navigation" aria-label="Main navigation">
    <button class="navbtn" data-view="dashboard" title="Dashboard (D)">Dashboard<span class="navkey">D</span></button>
    <button class="navbtn active" data-view="workspace" title="Workspace (1)">Workspace<span class="navkey">1</span></button>
    <button class="navbtn" data-view="lessons" title="Lessons (2)">Lessons<span class="navkey">2</span></button>
    <button class="navbtn" data-view="challenges" title="Challenges (3)">Challenges<span class="navkey">3</span></button>
    <button class="navbtn" data-view="debugging" title="Debugging (4)">Debugging<span class="navkey">4</span></button>
    <button class="navbtn" data-view="cheatsheet" title="Cheat Sheet (5)">Cheat Sheet<span class="navkey">5</span></button>
    <button class="navbtn" data-view="analytics" title="Progress (6)">Progress<span class="navkey">6</span></button>
    <button class="navbtn" data-view="history" title="History (7)">History<span class="navkey">7</span></button>
  </nav>
  <div class="topbar-right">
    <div class="xp-widget" id="xpWidget" aria-live="polite" title="XP and level"></div>
    <button class="iconbtn" id="shortcutsBtn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle dark or light theme">Dark</button>
  </div>
</header>

<main id="viewRoot" role="main">
  <!-- Fallback message if JS fails to load -->
  <noscript>
    <div class="boot fallback-boot" style="cursor:default">
      <div class="boot-mark">Py</div>
      <div class="bt" style="color:var(--amber);font-size:15px;max-width:480px;text-align:center;padding:0 20px">
        <b>JavaScript is required</b><br><br>
        PYTHON·LAB runs entirely in your browser using JavaScript and WebAssembly.<br>
        Please enable JavaScript and reload this page.
      </div>
    </div>
  </noscript>
  <div id="jsFallback" class="boot fallback-boot" style="display:none">
    <div class="boot-mark">Py</div>
    <div class="bt" style="color:var(--amber);font-size:15px;max-width:520px;text-align:center;padding:0 20px">
      <b>Failed to load the application</b><br><br>
      <span id="jsFallbackMsg">The JavaScript modules could not be loaded.</span><br><br>
      <span id="jsFallbackDetail" style="font-size:12.5px;opacity:.85"></span><br><br>
      <b>To fix:</b> Check your internet connection (CodeMirror &amp; Pyodide load from a CDN), then reload. No local server is required on GitHub Pages.
    </div>
    <button onclick="location.reload()" style="margin-top:18px;background:var(--accent);color:#111;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">Reload page</button>
  </div>
</main>

<!-- Run status toast -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Generic modal -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Modal</h2>
      <button class="iconbtn" id="modalClose" aria-label="Close dialog (Escape)">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- CodeMirror scripts (pinned CDN; editor falls back to textarea if blocked) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/python-hint.min.js" crossorigin="anonymous"></script>
<script>
  // Diagnostics for GitHub Pages: capture the REAL module load error (no false file:// blame).
  (function () {
    function showFallback(reason) {
      var box = document.getElementById('jsFallback');
      if (!box || window.__pythonLabLoaded) return;
      box.style.display = 'flex';
      var overlay = document.querySelector('.boot:not(.fallback-boot)');
      if (overlay) overlay.remove();
      if (reason) {
        var d = document.getElementById('jsFallbackDetail');
        if (d) d.textContent = 'Details: ' + reason;
        console.error('[python-lab] boot failure:', reason);
      }
    }
    window.__pythonLabFail = showFallback;
    window.addEventListener('error', function (e) {
      var t = e.target;
      // Resource load error (script/link/module 404, CSP block, offline CDN…)
      if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
        var src = t.src || t.href || '';
        showFallback('A script or stylesheet failed to load: ' + src);
      } else if (e.message && !window.__pythonLabLoaded) {
        showFallback(e.message);
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (!window.__pythonLabLoaded) {
        showFallback('' + ((e.reason && (e.reason.message || e.reason)) || e.reason || 'unknown error'));
      }
    });
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (!window.__pythonLabLoaded) {
          var hint = location.protocol === 'file:'
            ? 'It looks like this page was opened directly from disk (file://), where ES modules are blocked by the browser. Please use the GitHub Pages URL instead.'
            : 'The app module did not report success. This is usually a blocked/failed CDN script or an incorrect base path — see Details above and the browser console (F12).';
          var m = document.getElementById('jsFallbackMsg');
          if (m) m.textContent = 'The JavaScript modules could not be loaded. ' + hint;
          document.getElementById('jsFallback').style.display = 'flex';
          var overlay = document.querySelector('.boot:not(.fallback-boot)');
          if (overlay) overlay.remove();
        }
      }, 4000);
    });
  })();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
